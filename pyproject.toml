[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qutai"
version = "1.2"
description = "A lightweight numerical, machine learning and quantum computing SDK."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.urls]
Repository = "https://github.com/utai-utai/Qutai"
Issues = "https://github.com/utai-utai/Qutai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qutai = ["backends/apple/*.mm", "backends/apple/*.metal", "backends/cuda/*.cu"]
