[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qutai"
version = "0.1.0"
description = "A lightweight numerical, machine learning and quantum computing SDK."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.urls]
Repository = "https://github.com/utai-utai/Qutai"
Issues = "https://github.com/utai-utai/Qutai/issues"

[tool.setuptools.packages.find]
where = ["src"]
